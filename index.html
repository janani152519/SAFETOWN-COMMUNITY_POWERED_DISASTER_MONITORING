<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeTown Alerts</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .alert-card { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 6px; border-left: 6px solid #ff6b6b; }
        .alert-card h3 { margin: 0 0 10px; }
        .alert-card p { margin: 4px 0; font-size: 14px; }
        .btn { display: inline-block; padding: 8px 12px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn:hover { opacity: 0.9; }
        form { margin-top: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SafeTown Real-Time Alerts</h1>
        
        <div id="alerts-container"></div>
        
        <h2>Create New Alert</h2>
        <form id="alert-form">
            <input type="text" id="host_name" placeholder="Your Name" required>
            <input type="text" id="type" placeholder="Type (Fire, Flood, Bandit, Storm)" required>
            <input type="text" id="title" placeholder="Title" required>
            <select id="severity" required>
                <option value="">Select Severity</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            <textarea id="tips" placeholder="Safety Tips" required></textarea>
            <input type="number" id="lat" placeholder="Latitude" required>
            <input type="number" id="lng" placeholder="Longitude" required>
            <button type="submit" class="btn btn-primary">Submit Alert</button>
        </form>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Fetch and display alerts
        async function fetchAlerts() {
            const res = await fetch(`${API_URL}/alerts`);
            const data = await res.json();
            const container = document.getElementById("alerts-container");
            container.innerHTML = "";
            data.forEach(alert => {
                const div = document.createElement("div");
                div.className = "alert-card";
                div.innerHTML = `
                    <h3>${alert.title}</h3>
                    <p><strong>Type:</strong> ${alert.type}</p>
                    <p><strong>Severity:</strong> ${alert.severity}</p>
                    <p><strong>Status:</strong> ${alert.status}</p>
                    <p><strong>Tips:</strong> ${alert.tips}</p>
                    <p><strong>Location:</strong> ${alert.lat}, ${alert.lng}</p>
                `;
                container.appendChild(div);
            });
        }

        // Submit new alert
        document.getElementById("alert-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertData = {
                host_name: document.getElementById("host_name").value,
                type: document.getElementById("type").value,
                title: document.getElementById("title").value,
                severity: document.getElementById("severity").value,
                tips: document.getElementById("tips").value,
                lat: parseFloat(document.getElementById("lat").value),
                lng: parseFloat(document.getElementById("lng").value)
            };

            const res = await fetch(`${API_URL}/alert`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(alertData)
            });

            if (res.ok) {
                alert("Alert submitted successfully!");
                document.getElementById("alert-form").reset();
                fetchAlerts();
            } else {
                alert("Failed to submit alert.");
            }
        });

        // Load alerts on page load
        fetchAlerts();
    </script>
</body>
</html>
